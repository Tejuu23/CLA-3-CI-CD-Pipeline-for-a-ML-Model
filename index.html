<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ML CI/CD Pipeline</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 4px 12px #ccc;
        }

        h1 {
            color: #2563eb;
        }

        .status {
            color: green;
            font-weight: bold;
        }

        .info {
            font-size: 18px;
            margin: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Machine Learning CI/CD Pipeline</h1>

        <h2>Random Forest Classifier</h2>

        <p class="info">
            <b>Dataset:</b> Iris Dataset
        </p>

        <p class="info">
            <b>Task:</b> Flower Classification
        </p>

        <p class="info">
            <b>Model Accuracy:</b> Approximately 96.67%
        </p>

        <p class="info">
            <b>CI Status:</b> Automated tests using pytest
        </p>

        <p class="status">
            CD Status: Successfully Deployed
        </p>

        <p>
            Automated using GitHub Actions and GitHub Pages.
        </p>

    </div>

</body>
</html>
